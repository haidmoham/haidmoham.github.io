name: Resume sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: resume-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PRODUCTION_RESUME_DOC_ID: ${{ secrets.PRODUCTION_RESUME_DOC_ID }}
      SIMULATION_RESUME_DOC_ID: ${{ secrets.SIMULATION_RESUME_DOC_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Export and validate both resumes
        run: python3 scripts/sync_resumes.py "$RUNNER_TEMP/resume-exports"
      - name: Update the tracked PDFs
        id: pdfs
        shell: bash
        run: |
          set -euo pipefail
          changed=false
          for filename in \
            Mohammad_Haider_Production_Software_Engineering_Resume.pdf \
            Mohammad_Haider_Simulation_and_Scientific_Computing_Resume.pdf
          do
            source_file="$RUNNER_TEMP/resume-exports/$filename"
            tracked_file="resumes/$filename"
            if ! cmp --silent "$source_file" "$tracked_file"; then
              install -m 0644 "$source_file" "$tracked_file"
              changed=true
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Validate the website
        run: python3 scripts/validate_site.py
      - name: Commit and publish changed PDFs
        if: steps.pdfs.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            resumes/Mohammad_Haider_Production_Software_Engineering_Resume.pdf \
            resumes/Mohammad_Haider_Simulation_and_Scientific_Computing_Resume.pdf
          git commit -m "chore(resumes): sync Drive exports"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Run site integrity on the published commit
        if: steps.pdfs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site-integrity.yml --ref main
