name: Refresh canonical C-1N checkpoint

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c1n-checkpoint-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test checkpoint publication safeguards
        run: python -m unittest scripts/test_sync_c1n_checkpoint.py
      - name: Fetch the canonical checkpoint and verified media
        run: python scripts/sync-c1n-checkpoint.py
      - name: Validate the website
        run: python scripts/validate_site.py
      - name: Publish a changed canonical checkpoint
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add -- index.html assets/c1n
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "chore(c1n): sync canonical checkpoint" \
            -m "Source: https://raw.githubusercontent.com/haidmoham/spider/master/public/checkpoint.json"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Run site integrity on the published commit
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site-integrity.yml --ref main
