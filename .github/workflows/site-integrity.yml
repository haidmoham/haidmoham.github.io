name: Site integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate static routes and deployment contract
        run: python scripts/validate_site.py
      - name: Build the Railway image
        run: docker build --tag portfolio-site:test .
      - name: Smoke-test the Railway image
        shell: bash
        run: |
          docker run --detach --rm --name portfolio-site-test --publish 18080:8080 portfolio-site:test
          trap 'docker stop portfolio-site-test' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:18080/ >/dev/null && break
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:18080/c1n/ | grep --quiet '01 · SHUFFLE · Current'
          curl --fail --silent --head http://127.0.0.1:18080/c1n/ | grep --ignore-case --quiet "wasm-unsafe-eval"
          curl --fail --silent --head http://127.0.0.1:18080/spider/vendor/mujoco/mujoco.wasm | grep --ignore-case --quiet 'content-type: application/wasm'
